# Demo: la base gratuita de Render vence a los 30 días. Para uso real, elegí un plan
# de PostgreSQL pago antes de cargar datos operativos. No guardes contraseñas aquí.
databases:
  - name: inmortalclub-db
    plan: free

services:
  - type: web
    name: inmortalclub
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build && cd ../frontend && npm ci --include=dev && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run admin:bootstrap && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inmortalclub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
